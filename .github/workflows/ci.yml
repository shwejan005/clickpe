name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend evaluations
        run: PYTHONPATH=backend python -m pytest backend/evals -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check and build frontend
        run: npm run build
        working-directory: frontend

  validate:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML validator dependency
        run: python -m pip install PyYAML
      - name: Validate configuration files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def cfn_tag(loader, suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  value = loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  value = loader.construct_sequence(node)
              else:
                  value = loader.construct_mapping(node)
              return {suffix: value}

          CloudFormationLoader.add_multi_constructor('!', cfn_tag)
          for path in ('serverless.yml', 'docker-compose.aws.yml'):
              yaml.safe_load(Path(path).read_text())
          yaml.load(Path('infra/github-actions-deploy-role.yml').read_text(), Loader=CloudFormationLoader)
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          for path in Path('workflows').glob('*.json'):
              json.loads(path.read_text())
          print('YAML and workflow JSON parsed successfully')
          PY
      - name: Check shell syntax and whitespace
        run: |
          bash -n scripts/deploy-aws.sh
          bash -n scripts/setup-github-actions-oidc.sh
          sh -n scripts/import-n8n-workflows.sh
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA"
          else
            base=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              git diff --check HEAD^1 HEAD
            else
              git diff --check "$base" "$GITHUB_SHA"
            fi
          fi
