services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loan_engine}
      POSTGRES_USER: ${POSTGRES_USER:-loan_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loan_engine} -d ${POSTGRES_DB:-loan_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-loan_engine}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-loan_engine}
      UPLOAD_DIR: /data/uploads
      N8N_MATCH_WEBHOOK: http://n8n:5678/webhook/loan-match
      N8N_NOTIFICATION_WEBHOOK: http://n8n:5678/webhook/loan-notify
      CORS_ORIGINS: http://localhost:5173
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      NOTIFICATION_TEST_RECIPIENT: ${NOTIFICATION_TEST_RECIPIENT:-}
      MAIL_FROM: ${MAIL_FROM:-loan-engine@localhost}
      NOTIFICATION_PAGE_SIZE: ${NOTIFICATION_PAGE_SIZE:-10}
      NOTIFICATION_MAX_PER_BATCH: ${NOTIFICATION_MAX_PER_BATCH:-25}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_FILE: ${FIREBASE_SERVICE_ACCOUNT_FILE:-/run/secrets/firebase-service-account.json}
      FIREBASE_BOOTSTRAP_ADMIN_EMAIL: ${FIREBASE_BOOTSTRAP_ADMIN_EMAIL:-}
      DEFAULT_WORKSPACE_NAME: ${DEFAULT_WORKSPACE_NAME:-ClickPe Local Workspace}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/data/uploads
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
      VITE_UPLOAD_MODE: ${VITE_UPLOAD_MODE:-local}
      VITE_UPLOAD_PRESIGN_URL: ${VITE_UPLOAD_PRESIGN_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-development-encryption-key-change-me}
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      LOAN_NOTIFICATION_TRANSPORT: ${LOAN_NOTIFICATION_TRANSPORT:-mailpit}
      N8N_AWS_SYSTEM_CREDENTIALS_ACCESS_ENABLED: ${N8N_AWS_SYSTEM_CREDENTIALS_ACCESS_ENABLED:-false}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    ports:
      - "5678:5678"
    volumes:
      - n8n_data_v2:/home/node/.n8n
      - ./workflows:/opt/loan-engine/workflows:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  n8n_data_v2:

